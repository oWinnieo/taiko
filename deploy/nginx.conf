server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/wasm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|map|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|otf|ogg|mp3|wav|tja|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
